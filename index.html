<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мессенджер</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--acc:#0078d7;--bg:#fff;--text:#000;--sub:#6b6b6b;--in:#e6e6e6;--out:#cce4f7;--line:#d0d0d0;--bar:#f2f2f2}
@media (prefers-color-scheme:dark){:root{--bg:#000;--text:#fff;--sub:#9a9a9a;--in:#2b2b2b;--out:#0b4f86;--line:#333;--bar:#1f1f1f}}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.35 "Segoe UI",-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}.screen.on{display:flex}
header{background:var(--acc);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;font-size:20px;font-weight:300}
header .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:22px;padding:0 4px}
.scroll{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.row:active{background:var(--bar)}
.av{width:48px;height:48px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;overflow:hidden}
.av.s{width:32px;height:32px;font-size:18px}.av img{width:100%;height:100%;object-fit:cover}
.rt{flex:1;min-width:0}.rt b{display:flex;justify-content:space-between;font-weight:600}
.rt b i{font-style:normal;font-weight:400;color:var(--sub);font-size:12px}
.rt div{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cdesc{padding:6px 16px;background:var(--bar);color:var(--sub);font-size:13px;border-bottom:1px solid var(--line)}
#msgs{padding:10px;display:flex;flex-direction:column;gap:6px}
.mw{display:flex;gap:6px;align-items:flex-end;max-width:88%;align-self:flex-start}.mw.me{align-self:flex-end}
.m{padding:6px 10px;background:var(--in);overflow-wrap:anywhere}.mw.me .m{background:var(--out)}
.m small{display:block;color:var(--acc);font-weight:600;font-size:12px}.mw.me .m small{display:none}
.m time{display:block;text-align:right;color:var(--sub);font-size:11px}
.bar{display:flex;background:var(--bar);border-top:1px solid var(--line);padding:8px;gap:8px}
.bar.ro{justify-content:center;color:var(--sub);padding:14px}
input,textarea{border:2px solid var(--line);background:var(--bg);color:var(--text);padding:10px;font:inherit;min-width:0}
input:focus,textarea:focus{outline:0;border-color:var(--acc)}
.bar input{flex:1}.bar button{background:var(--acc);color:#fff;border:0;width:48px;font-size:20px}
.form{margin:auto;width:min(340px,92%);display:flex;flex-direction:column;gap:10px;padding:16px 0}
.form h2{font-weight:300;font-size:28px;margin:0}
.btn{background:var(--acc);color:#fff;border:0;padding:12px;font:inherit}.btn.g{background:var(--bar);color:var(--text);border:1px solid var(--line)}
.btn.s{padding:6px 12px}
.tabs{display:flex}.tabs button{flex:1;padding:10px;border:0;background:var(--bar);color:var(--sub);font:inherit}.tabs button.on{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--bar);cursor:pointer;border:2px solid transparent}
.grid div.sel{border-color:var(--acc);background:var(--out)}
.err{color:#d13438;min-height:1.2em;font-size:13px}.lbl{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;margin:auto;padding:30px 20px}
</style>
</head>
<body>

<div class="screen on" id="auth"><div class="form">
  <h2>Мессенджер</h2>
  <div class="tabs"><button id="tl" class="on">Вход</button><button id="tr">Регистрация</button></div>
  <input id="email" type="email" placeholder="Почта" autocomplete="email">
  <input id="pass" type="password" placeholder="Пароль (от 6 символов)">
  <div id="regbox" style="display:none;flex-direction:column;gap:10px">
    <input id="uname" maxlength="24" placeholder="Ваше имя">
    <input id="rhandle" maxlength="20" placeholder="Юзернейм (a-z, 0-9, _)" autocapitalize="none">
    <div class="lbl">Выберите аватар (фото можно загрузить в профиле)</div>
    <div class="grid" id="grid1"></div>
  </div>
  <div class="err" id="err"></div>
  <button class="btn" id="submit">Войти</button>
</div></div>

<div class="screen" id="list">
  <header><span class="t">Чаты</span><button id="adm" title="Админ-панель" style="display:none">🛡</button><button id="find" title="Найти">🔍</button><button id="new" title="Создать">＋</button><button id="me" title="Профиль">👤</button></header>
  <div class="scroll" id="rooms"></div>
</div>

<div class="screen" id="chat">
  <header><button id="back">←</button><span class="t" id="title"></span></header>
  <div id="cdesc"></div>
  <div class="scroll" id="msgs"></div>
  <div class="bar" id="cbar"><input id="text" maxlength="500" placeholder="Сообщение"><button id="send">➤</button></div>
</div>

<div class="screen" id="nc">
  <header><button id="ncback">←</button><span class="t">Новый чат</span></header>
  <div class="scroll"><div class="form">
    <div class="tabs"><button id="kg" class="on">Группа</button><button id="kc">Канал</button></div>
    <div class="lbl" id="khint"></div>
    <input id="ctitle" maxlength="40" placeholder="Название">
    <input id="cdescin" maxlength="200" placeholder="Описание">
    <div class="err" id="cerr"></div>
    <button class="btn" id="ccreate">Создать</button>
  </div></div>
</div>

<div class="screen" id="fd">
  <header><button id="fdback">←</button><span class="t">Поиск чатов</span></header>
  <div style="padding:10px;display:flex;gap:8px"><input id="fq" placeholder="Название группы или канала" style="flex:1"><button class="btn" id="fgo">Найти</button></div>
  <div class="scroll" id="fres"></div>
</div>

<div class="screen" id="admin">
  <header><button id="aback">←</button><span class="t">Админ-панель</span></header>
  <div class="scroll" id="abox"></div>
</div>

<div class="screen" id="prof">
  <header><button id="pback">←</button><span class="t">Профиль</span></header>
  <div class="scroll"><div class="form">
    <div class="av" style="width:90px;height:90px;font-size:48px;align-self:center" id="pav"></div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn s" id="pphoto">Загрузить фото</button><button class="btn s g" id="pnophoto">Убрать фото</button>
    </div>
    <input type="file" id="pfile" accept="image/*" style="display:none">
    <div class="lbl">Или эмодзи</div><div class="grid" id="grid2"></div>
    <div class="lbl">Имя</div><input id="pname" maxlength="24">
    <div class="lbl">Юзернейм</div><input id="phandle" maxlength="20" autocapitalize="none">
    <div class="lbl">Описание</div><textarea id="pbio" maxlength="200" rows="3"></textarea>
    <div class="err" id="perr"></div>
    <button class="btn" id="psave">Сохранить</button>
    <button class="btn g" id="logout">Выйти</button>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://fwkcgyxmgzsixjgmpnut.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3a2NneXhtZ3pzaXhqZ21wbnV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjYyMjUsImV4cCI6MjEwODM0MjIyNX0.mn8BY9rF-tuSjUMk8LwJx6IFVVPFiDLKOvqloP8kWMc";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const AV = "😀 😎 🤓 🥳 😺 🐶 🦊 🐼 🐸 🦁 🐵 🐧 🚀 ⚡ 🔥 🌈 🎧 🎮 ⚽ 🍕 🌵 🍀 👾 🤖".split(" ");
const HRE = /^[a-z0-9_]{3,20}$/;
let me = null, cur = null, mode = "login", kind = "group", subscribed = false;
let prof = {}, chats = {}, mem = new Set(), all = [];
let regAv = AV[0], pEmoji = AV[0], pUrl = null, pBlob = null;

const hm = t => new Date(t).toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"});
const show = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
const who = id => prof[id] || {username: "…", avatar: "👤"};
const badge = p => p && p.verified ? " ✔" : "";
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };

function avEl(p, small) {
  const d = el("div", "av" + (small ? " s" : ""));
  if (p.avatar_url) { const i = el("img"); i.src = p.avatar_url; d.appendChild(i); } else d.textContent = p.avatar;
  return d;
}
const chatAv = c => el("div", "av", c.kind === "channel" ? "📢" : "👥");
function grid(box, get, set) {
  box.textContent = "";
  AV.forEach(a => { const d = el("div", a === get() ? "sel" : "", a); d.onclick = () => { set(a); grid(box, get, set); }; box.appendChild(d); });
}

/* ---------- вход / регистрация ---------- */
function setMode(m) {
  mode = m;
  $("tl").classList.toggle("on", m === "login"); $("tr").classList.toggle("on", m === "reg");
  $("regbox").style.display = m === "reg" ? "flex" : "none";
  $("submit").textContent = m === "reg" ? "Зарегистрироваться" : "Войти";
  $("err").textContent = "";
}
async function submit() {
  const email = $("email").value.trim().toLowerCase(), password = $("pass").value;
  $("err").textContent = "";
  if (!email || password.length < 6) { $("err").textContent = "Введите почту и пароль от 6 символов"; return; }
  if (mode === "reg") {
    const username = $("uname").value.trim(), handle = $("rhandle").value.trim().toLowerCase().replace(/^@/, "");
    if (!username) { $("err").textContent = "Введите имя"; return; }
    if (!HRE.test(handle)) { $("err").textContent = "Юзернейм: 3–20 символов, a-z, 0-9 и _"; return; }
    const free = await sb.rpc("handle_free", {h: handle});
    if (free.data === false) { $("err").textContent = "Этот юзернейм занят"; return; }
    const {data, error} = await sb.auth.signUp({email, password, options: {data: {username, handle, avatar: regAv}}});
    if (error) { $("err").textContent = error.message; return; }
    if (!data.session) { setMode("login"); $("err").textContent = "Мы отправили письмо. Подтвердите почту и войдите."; return; }
    enter(data.session.user);
  } else {
    const {data, error} = await sb.auth.signInWithPassword({email, password});
    if (error) {
      const m = error.message || "";
      $("err").textContent = /not confirmed/i.test(m) ? "Почта не подтверждена. Откройте письмо и перейдите по ссылке."
        : /invalid login/i.test(m) ? "Неверная почта или пароль. Если вы ещё не регистрировались, откройте «Регистрация»." : m;
      return;
    }
    enter(data.user);
  }
}

/* ---------- данные ---------- */
async function loadProfiles(ids) {
  const miss = [...new Set(ids)].filter(i => i && !prof[i]);
  if (!miss.length) return;
  const {data} = await sb.from("profiles").select("*").in("id", miss);
  (data || []).forEach(p => prof[p.id] = p);
}
async function loadChats() {
  const m = await sb.from("chat_members").select("chat_id").eq("user_id", me.id);
  const ids = (m.data || []).map(x => x.chat_id);
  mem = new Set(ids); all = [];
  if (ids.length) {
    const c = await sb.from("chats").select("*").in("id", ids);
    (c.data || []).forEach(x => chats[x.id] = x);
    const r = await sb.from("messages").select("*").in("chat_id", ids).order("created_at", {ascending: false}).limit(500);
    all = (r.data || []).reverse();
    await loadProfiles(all.map(x => x.user_id).concat((c.data || []).map(x => x.owner_id)));
  }
  renderList();
}
async function enter(user) {
  let {data} = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (!data) data = {id: user.id, username: user.user_metadata?.username || "user", handle: user.user_metadata?.handle || "", bio: "", avatar: user.user_metadata?.avatar || AV[0], avatar_url: null};
  me = data; prof[me.id] = me;
  $("adm").style.display = me.is_admin ? "" : "none";
  show("list");
  await loadChats();
  if (!subscribed) {
    subscribed = true;
    sb.channel("all").on("postgres_changes", {event: "INSERT", schema: "public", table: "messages"}, async p => {
      if (!mem.has(p.new.chat_id)) return;
      await loadProfiles([p.new.user_id]);
      all.push(p.new); renderList();
      if (cur === p.new.chat_id && $("chat").classList.contains("on")) renderChat();
    }).subscribe();
  }
}

/* ---------- список и чат ---------- */
function renderList() {
  const box = $("rooms"); box.textContent = "";
  const last = {}; all.forEach(m => last[m.chat_id] = m);
  const items = [...mem].map(id => chats[id]).filter(Boolean)
    .sort((a, b) => ((last[b.id]?.created_at || b.created_at) > (last[a.id]?.created_at || a.created_at)) ? 1 : -1);
  if (!items.length) { box.appendChild(el("div", "empty", "Чатов пока нет. Создайте группу или канал кнопкой ＋ либо найдите чужой через 🔍.")); return; }
  items.forEach(c => {
    const m = last[c.id], rt = el("div", "rt"), b = el("b");
    b.append(el("span", "", c.title), el("i", "", m ? hm(m.created_at) : ""));
    rt.append(b, el("div", "", m ? who(m.user_id).username + badge(who(m.user_id)) + ": " + m.text : (c.kind === "channel" ? "Канал" : "Группа")));
    const r = el("div", "row"); r.append(chatAv(c), rt); r.onclick = () => open(c.id); box.appendChild(r);
  });
}
function renderChat() {
  const c = chats[cur], box = $("msgs"); box.textContent = "";
  $("title").textContent = c.title;
  $("cdesc").textContent = (c.kind === "channel" ? "Канал" : "Группа") + (c.description ? " · " + c.description : "");
  const can = c.kind === "group" || c.owner_id === me.id;
  const bar = $("cbar"); bar.classList.toggle("ro", !can);
  $("text").style.display = $("send").style.display = can ? "" : "none";
  bar.dataset.ro = can ? "" : "1";
  let ro = bar.querySelector(".rot"); if (ro) ro.remove();
  if (!can) bar.prepend(el("span", "rot", "В этом канале пишет только владелец"));
  const list = all.filter(m => m.chat_id === cur);
  if (!list.length) { box.appendChild(el("div", "empty", "Здесь пока пусто.")); return; }
  list.forEach(m => {
    const mine = m.user_id === me.id, p = who(m.user_id);
    const w = el("div", "mw" + (mine ? " me" : "")), d = el("div", "m");
    d.append(el("small", "", p.username + badge(p)), el("span", "", m.text), el("time", "", hm(m.created_at)));
    if (!mine) w.append(avEl(p, true));
    w.append(d); box.appendChild(w);
  });
  box.scrollTop = box.scrollHeight;
}
function open(id) { cur = id; show("chat"); renderChat(); }
async function send() {
  const v = $("text").value.trim(); if (!v || !cur) return;
  $("text").value = "";
  const {error} = await sb.from("messages").insert({chat_id: cur, user_id: me.id, text: v});
  if (error) { $("text").value = v; alert("Не отправлено: " + error.message); }
}

/* ---------- создание и поиск ---------- */
function setKind(k) {
  kind = k; $("kg").classList.toggle("on", k === "group"); $("kc").classList.toggle("on", k === "channel");
  $("khint").textContent = k === "group" ? "В группе пишут все участники." : "В канале публикует только владелец, остальные читают.";
}
async function createChat() {
  const title = $("ctitle").value.trim(); $("cerr").textContent = "";
  if (!title) { $("cerr").textContent = "Введите название"; return; }
  const {data, error} = await sb.from("chats").insert({kind, title, description: $("cdescin").value.trim(), owner_id: me.id}).select().single();
  if (error) { $("cerr").textContent = error.message; return; }
  chats[data.id] = data; await loadChats(); open(data.id);
}
async function search() {
  const q = $("fq").value.trim(), box = $("fres"); box.textContent = "";
  let query = sb.from("chats").select("*").order("created_at", {ascending: false}).limit(30);
  if (q) query = query.ilike("title", "%" + q + "%");
  const {data} = await query;
  if (!data || !data.length) { box.appendChild(el("div", "empty", "Ничего не найдено")); return; }
  data.forEach(c => {
    chats[c.id] = c;
    const rt = el("div", "rt"); rt.append(el("b", "", c.title), el("div", "", (c.kind === "channel" ? "Канал" : "Группа") + (c.description ? " · " + c.description : "")));
    const r = el("div", "row"), joined = mem.has(c.id), btn = el("button", "btn s", joined ? "Открыть" : "Вступить");
    btn.onclick = async () => {
      if (!joined) { const {error} = await sb.from("chat_members").insert({chat_id: c.id, user_id: me.id}); if (error) { alert(error.message); return; } await loadChats(); }
      open(c.id);
    };
    r.append(chatAv(c), rt, btn); box.appendChild(r);
  });
}

/* ---------- профиль ---------- */
function drawPav() {
  const d = $("pav"); d.textContent = "";
  if (pBlob || pUrl) { const i = el("img"); i.src = pBlob ? URL.createObjectURL(pBlob) : pUrl; d.appendChild(i); } else d.textContent = pEmoji;
}
function openProfile() {
  pEmoji = me.avatar; pUrl = me.avatar_url; pBlob = null;
  $("pname").value = me.username; $("phandle").value = me.handle; $("pbio").value = me.bio || ""; $("perr").textContent = "";
  grid($("grid2"), () => pEmoji, a => { pEmoji = a; pUrl = null; pBlob = null; drawPav(); });
  drawPav(); show("prof");
}
function pickFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const s = Math.min(img.width, img.height);
    c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
    c.toBlob(b => { pBlob = b; drawPav(); }, "image/jpeg", 0.85);
  };
  img.src = URL.createObjectURL(f);
}
async function saveProfile() {
  const username = $("pname").value.trim(), handle = $("phandle").value.trim().toLowerCase().replace(/^@/, "");
  $("perr").textContent = "";
  if (!username) { $("perr").textContent = "Введите имя"; return; }
  if (!HRE.test(handle)) { $("perr").textContent = "Юзернейм: 3–20 символов, a-z, 0-9 и _"; return; }
  let url = pUrl;
  if (pBlob) {
    const path = me.id + "/avatar.jpg";
    const up = await sb.storage.from("avatars").upload(path, pBlob, {upsert: true, contentType: "image/jpeg"});
    if (up.error) { $("perr").textContent = "Фото не загрузилось: " + up.error.message; return; }
    url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
  }
  const upd = {username, handle, bio: $("pbio").value.trim(), avatar: pEmoji, avatar_url: url};
  const {error} = await sb.from("profiles").update(upd).eq("id", me.id);
  if (error) { $("perr").textContent = error.code === "23505" ? "Этот юзернейм занят" : error.message; return; }
  Object.assign(me, upd); prof[me.id] = me;
  renderList(); show("list");
}

/* ---------- админ-панель ---------- */
async function openAdmin() {
  show("admin");
  const box = $("abox"); box.textContent = "";
  const [u, c] = await Promise.all([
    sb.from("profiles").select("*").order("username").limit(200),
    sb.from("chats").select("*").order("created_at", {ascending: false}).limit(100)]);
  const users = u.data || [], cl = c.data || [];
  const call = async (fn, args) => { const {error} = await sb.rpc(fn, args); if (error) alert(error.message); else openAdmin(); };
  box.append(el("div", "lbl", "  Пользователи: " + users.length));
  users.forEach(p => {
    prof[p.id] = p; if (p.id === me.id) { me.verified = p.verified; me.is_admin = p.is_admin; }
    const rt = el("div", "rt");
    rt.append(el("b", "", p.username + badge(p)), el("div", "", "@" + p.handle + (p.is_admin ? " · админ" : "")));
    const b1 = el("button", "btn s", p.verified ? "Снять ✔" : "Дать ✔");
    b1.onclick = () => call("admin_set_verified", {uid: p.id, val: !p.verified});
    const b2 = el("button", "btn s g", p.is_admin ? "Убрать админа" : "Сделать админом");
    b2.onclick = () => call("admin_set_admin", {uid: p.id, val: !p.is_admin});
    const act = el("div"); act.style.cssText = "display:flex;flex-direction:column;gap:4px";
    act.append(b1, b2);
    const r = el("div", "row"); r.style.cursor = "default"; r.append(avEl(p), rt, act); box.appendChild(r);
  });
  box.append(el("div", "lbl", "  Чаты: " + cl.length));
  cl.forEach(ch => {
    const rt = el("div", "rt");
    rt.append(el("b", "", ch.title), el("div", "", (ch.kind === "channel" ? "Канал" : "Группа") + " · " + (prof[ch.owner_id]?.username || "")));
    const b = el("button", "btn s g", "Удалить");
    b.onclick = async () => {
      if (!confirm("Удалить «" + ch.title + "» со всеми сообщениями?")) return;
      const {error} = await sb.rpc("admin_delete_chat", {cid: ch.id});
      if (error) { alert(error.message); return; }
      await loadChats(); openAdmin();
    };
    const r = el("div", "row"); r.style.cursor = "default"; r.append(chatAv(ch), rt, b); box.appendChild(r);
  });
}

/* ---------- запуск ---------- */
$("tl").onclick = () => setMode("login"); $("tr").onclick = () => setMode("reg");
$("submit").onclick = submit; $("pass").onkeydown = e => e.key === "Enter" && submit();
$("text").onkeydown = e => e.key === "Enter" && send(); $("send").onclick = send;
$("back").onclick = () => { cur = null; renderList(); show("list"); };
$("new").onclick = () => { $("ctitle").value = ""; $("cdescin").value = ""; $("cerr").textContent = ""; setKind("group"); show("nc"); };
$("ncback").onclick = () => show("list");
$("kg").onclick = () => setKind("group"); $("kc").onclick = () => setKind("channel");
$("ccreate").onclick = createChat;
$("find").onclick = () => { $("fq").value = ""; show("fd"); search(); };
$("fdback").onclick = () => show("list"); $("fgo").onclick = search; $("fq").onkeydown = e => e.key === "Enter" && search();
$("adm").onclick = openAdmin; $("aback").onclick = () => show("list");
$("me").onclick = openProfile; $("pback").onclick = () => show("list");
$("pphoto").onclick = () => $("pfile").click(); $("pfile").onchange = pickFile;
$("pnophoto").onclick = () => { pUrl = null; pBlob = null; drawPav(); };
$("psave").onclick = saveProfile;
$("logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };
grid($("grid1"), () => regAv, a => regAv = a);
sb.auth.getSession().then(({data}) => { if (data.session) enter(data.session.user); });
</script>
